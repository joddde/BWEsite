<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Watch Equities — Investor Login</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      /* Colors */
      --bg: #2b2b2b;          /* dark grey background */
      --text: #222222;        /* slightly darker grey text than the bg */
      --muted: #3a3a3a;       /* muted lines/borders */
      --field-bg: #262626;    /* input background */
      --field-border: #3a3a3a;
      --field-text: #e6e6e6;  /* input text (lighter for legibility) */
      --accent-err: #b33;     /* thin accent for error bar */

      /* Sizing */
      --radius: 10px;
      --space: 16px;
      --maxw: 420px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      font-size: 16px; /* prevent zoom on iOS inputs */
    }

    .page{
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header{
      width: 100%;
      text-align: center;
      padding-top: clamp(28px, 9vh, 88px); /* “near the top” */
      padding-left: var(--space);
      padding-right: var(--space);
    }

    h1{
      margin: 0 0 8px;
      font-weight: 600;
      font-size: clamp(22px, 4.8vw, 36px);
      letter-spacing: 0.4px;
    }

    .subtitle{
      margin: 0;
      font-size: clamp(12px, 2.8vw, 14px);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .wrap{
      width: 100%;
      max-width: var(--maxw);
      margin-top: clamp(20px, 4vh, 40px);
      padding: 0 var(--space);
    }

    .error{
      display: none; /* revealed on submit */
      align-items: center;
      gap: 10px;
      background: transparent;         /* keep within the dark, monochrome look */
      color: var(--text);               /* grey text per request */
      border-left: 4px solid var(--accent-err); /* subtle red accent bar */
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .error.show{ display: flex; }

    form{
      display: grid;
      gap: 12px;
    }

    label{
      font-size: 13px;
      color: var(--text); /* slightly darker grey text */
    }

    .field{
      display: grid;
      gap: 6px;
    }

    input[type="text"],
    input[type="password"]{
      width: 100%;
      appearance: none;
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: var(--field-text); /* lighter for readability inside fields */
      padding: 12px 14px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
      font-size: 16px;
    }
    input::placeholder{ color: #8a8a8a; }

    input:focus{
      border-color: #5a5a5a;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
    }

    .actions{
      margin-top: 4px;
    }

    button{
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--muted);
      background: #1a1a1a;   /* slightly darker than bg */
      color: #e6e6e6;        /* readable label for accessibility */
      font-size: 16px;
      cursor: pointer;
      transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
      touch-action: manipulation;
    }

    button:hover{
      background: #171717;
      border-color: #5a5a5a;
    }
    button:active{ transform: scale(0.995); }

    /* Small print / footer spacing if needed later */
    .spacer{ height: 10vh; }

    @media (prefers-reduced-motion: reduce){
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Black Watch Equities</h1>
      <p class="subtitle">Investor Login</p>
    </header>

    <div class="wrap">
      <!-- Error shown just above the username field -->
      <div id="error" class="error" role="alert" aria-live="assertive" aria-hidden="true">
        <span>incorrect password or username</span>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" inputmode="email" autocomplete="username" placeholder="Enter username" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" />
        </div>

        <div class="actions">
          <!-- Per your wording, the button is labeled “Return” -->
          <button type="submit" id="submit-btn">Return</button>
        </div>
      </form>

      <div class="spacer" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    (function(){
      const form  = document.getElementById('login-form');
      const error = document.getElementById('error');
      const user  = document.getElementById('username');
      const pass  = document.getElementById('password');

      function showError(){
        error.classList.add('show');
        error.setAttribute('aria-hidden', 'false');
        // Scroll into view on small screens
        error.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function hideError(){
        if(error.classList.contains('show')){
          error.classList.remove('show');
          error.setAttribute('aria-hidden', 'true');
        }
      }

      form.addEventListener('submit', function(e){
        e.preventDefault();
        // Always “fail” – no real accounts
        showError();
        // Place focus back to username for convenience
        user.focus({ preventScroll: true });
      });

      // Optional: hide the error when user starts typing again
      [user, pass].forEach(el => {
        el.addEventListener('input', hideError);
      });
    })();
  </script>
</body>
</html>
