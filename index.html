<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Watch Equities — Investor Login</title>
  <style>
    :root{
      --bg: #2b2b2b;          /* dark grey background */
      --text: #000000;        /* black text */
      --field-bg: #262626;
      --field-border: #3a3a3a;
      --field-text: #000000;  /* black text inside inputs */
      --accent-err: #b33;
      --radius: 10px;
      --space: 16px;
      --maxw: 420px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      font-size: 16px;
    }

    .page{
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header{
      width: 100%;
      text-align: center;
      padding-top: clamp(28px, 9vh, 88px);
      padding-left: var(--space);
      padding-right: var(--space);
    }

    h1{
      margin: 0 0 8px;
      font-weight: 600;
      font-size: clamp(22px, 4.8vw, 36px);
    }

    .subtitle{
      margin: 0;
      font-size: clamp(12px, 2.8vw, 14px);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .wrap{
      width: 100%;
      max-width: var(--maxw);
      margin-top: clamp(20px, 4vh, 40px);
      padding: 0 var(--space);
    }

    .error{
      display: none;
      align-items: center;
      gap: 10px;
      color: var(--text);
      border-left: 4px solid var(--accent-err);
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .error.show{ display: flex; }

    form{
      display: grid;
      gap: 12px;
    }

    label{
      font-size: 13px;
      color: var(--text);
    }

    .field{
      display: grid;
      gap: 6px;
    }

    input[type="text"],
    input[type="password"]{
      width: 100%;
      border: 1px solid var(--field-border);
      background: var(--field-bg);
      color: var(--field-text);
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 16px;
    }
    input::placeholder{ color: #555; }

    .actions{
      margin-top: 4px;
    }

    button{
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid #000;
      background: #1a1a1a;
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }
    button:hover{ background: #171717; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Black Watch Equities</h1>
      <p class="subtitle">Investor Login</p>
    </header>

    <div class="wrap">
      <div id="error" class="error" role="alert" aria-live="assertive" aria-hidden="true">
        <span>incorrect password or username</span>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" />
        </div>

        <div class="actions">
          <button type="submit">Return</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    const user = document.getElementById('username');

    form.addEventListener('submit', e => {
      e.preventDefault();
      error.classList.add('show');
      error.setAttribute('aria-hidden', 'false');
      user.focus();
    });
  </script>
</body>
</html>
